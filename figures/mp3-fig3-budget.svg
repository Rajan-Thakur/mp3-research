<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t"><title id="t">Budget: Pro for your own work, a capped $20 API key for the pipeline; measured pilot costs and the stop thresholds</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111216"/></marker></defs><rect width="900" height="380" fill="#FFFFFF"/><rect x="40" y="40" width="330" height="110" rx="8" fill="#ECEFFD" stroke="#4F5FD0" stroke-width="1.5"/><text x="205.0" y="81.33333333333333" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111216">Claude Pro ($20/month)</text><text x="205.0" y="99.33333333333333" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111216">your reading, Socratic grill, audit,</text><text x="205.0" y="117.33333333333333" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111216">drafting the report; light use</text><rect x="530" y="40" width="330" height="110" rx="8" fill="#ECEFFD" stroke="#4F5FD0" stroke-width="1.5"/><text x="695.0" y="81.33333333333333" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111216">MP3 API key, $20 prepaid, auto-reload OFF</text><text x="695.0" y="99.33333333333333" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111216">runs A and B, reviewer calls, experiments</text><text x="695.0" y="117.33333333333333" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111216">plan on about $10</text><rect x="100" y="220" width="700" height="22" fill="#FFFFFF" stroke="#DADCE5"/><line x1="100.0" y1="242" x2="100.0" y2="250" stroke="#555866"/><text x="100.0" y="266" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#555866">$0</text><line x1="275.0" y1="242" x2="275.0" y2="250" stroke="#555866"/><text x="275.0" y="266" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#555866">$5</text><line x1="450.0" y1="242" x2="450.0" y2="250" stroke="#555866"/><text x="450.0" y="266" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#555866">$10</text><line x1="625.0" y1="242" x2="625.0" y2="250" stroke="#555866"/><text x="625.0" y="266" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#555866">$15</text><line x1="800.0" y1="242" x2="800.0" y2="250" stroke="#555866"/><text x="800.0" y="266" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#555866">$20</text><rect x="100.0" y="220" width="112.0" height="22" fill="#ECEFFD" stroke="#111216" stroke-width="1"/><text x="220.0" y="236" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">run A measured $2.40–3.20</text><rect x="212.0" y="220" width="262.49999999999994" height="22" fill="#FFFFFF" stroke="#111216" stroke-width="1"/><text x="482.49999999999994" y="236" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216"></text><rect x="212.0" y="220" width="262.5" height="22" fill="#4F5FD0" opacity="0.35" stroke="#111216"/><text x="482.49999999999994" y="236" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">run B measured $4.00–7.50  (A+B = $6.40–10.70)</text><line x1="450.0" y1="180" x2="450.0" y2="242" stroke="#3A48A8" stroke-width="2" stroke-dasharray="5 3"/><text x="450.0" y="174" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3A48A8">review at $10</text><line x1="625.0" y1="180" x2="625.0" y2="242" stroke="#8A2C0D" stroke-width="2" stroke-dasharray="5 3"/><text x="625.0" y="174" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#8A2C0D">stop and email the instructor at $15</text><line x1="800.0" y1="180" x2="800.0" y2="242" stroke="#8A2C0D" stroke-width="2" stroke-dasharray="5 3"/><text x="800.0" y="174" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#8A2C0D">hard cap $20</text><text x="40" y="300" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2E3038">Check the console balance before and after every session and write it in notes/usage-ledger.csv.</text><text x="40" y="322" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2E3038">The reviewer is about three quarters of the cost: ask for a review when a stage is done, not after every change.</text><text x="40" y="352" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#555866">Escape clause: if Pro and the $20 are both exhausted, stop, keep the ledger, and see the instructor. A documented stop earns the partial credit the rubric allows.</text></svg>