<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t"><title id="t">From rubric items to the final grade: raw score, penalties, trimmed-class normalization</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111216"/></marker></defs><rect width="900" height="300" fill="#FFFFFF"/><rect x="30" y="60" width="190" height="120" rx="8" fill="#FFFFFF" stroke="#DADCE5" stroke-width="1.5"/><text x="125.0" y="98.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111216">20 rubric items</text><text x="125.0" y="115.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">F 15 · T 20 · D 15 · C 25 · P 25</text><text x="125.0" y="132.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">first-line LLM judge, then human</text><text x="125.0" y="149.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">= raw score /100</text><path d="M220 120L270 120" stroke="#111216" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="270" y="60" width="190" height="120" rx="8" fill="#FFFFFF" stroke="#8A2C0D" stroke-width="1.5"/><text x="365.0" y="98.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111216">Penalties</text><text x="365.0" y="115.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">X1 fabricated reference −3 each (cap −9)</text><text x="365.0" y="132.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">X2 AI slop −3 / −5</text><text x="365.0" y="149.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">human-confirmed</text><path d="M460 120L510 120" stroke="#111216" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="510" y="60" width="190" height="120" rx="8" fill="#ECEFFD" stroke="#4F5FD0" stroke-width="1.5"/><text x="605.0" y="98.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111216">Normalization</text><text x="605.0" y="115.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">drop the 2 highest and 2 lowest raw scores;</text><text x="605.0" y="132.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">scale so the highest remaining = 100;</text><text x="605.0" y="149.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">expected factor about ×2</text><path d="M700 120L750 120" stroke="#111216" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="750" y="60" width="120" height="120" rx="8" fill="#FFFFFF" stroke="#3A48A8" stroke-width="1.5"/><text x="810.0" y="106.33333333333333" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111216">Final grade</text><text x="810.0" y="124.33333333333333" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111216">1–100</text><text x="810.0" y="142.33333333333331" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111216">(capped at 100)</text><text x="30" y="220" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#555866">Pilot raw scores without any student-only items: 44 (unguided) and 57 (guided). Those items (video, your steering, replay, report) are the 43 points only you can add.</text><text x="30" y="242" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#555866">Expect raw scores in the 40s–60s under the token limits; the normalization is published here in advance, so a raw 45 is not a failing grade.</text><text x="30" y="272" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#555866">Order of operations: item scores → eligibility cap → penalties → lateness → class normalization → rounded once.</text></svg>