<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 314" width="900" height="314" role="img" aria-labelledby="t"><title id="t">From rubric items to the final grade: raw score, penalties, trimmed-class normalization</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111216"/></marker></defs><rect width="900" height="314" fill="#FFFFFF"/>
<rect x="30" y="40" width="185" height="140" rx="8" fill="#FFFFFF" stroke="#DADCE5" stroke-width="1.5"/>
<text x="122.5" y="71.0" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111216">20 rubric items</text>
<text x="122.5" y="88.0" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">F 15 · T 20 · D 15</text>
<text x="122.5" y="105.0" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">C 25 · R 25</text>
<text x="122.5" y="122.0" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">LLM judge first, then</text>
<text x="122.5" y="139.0" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">human</text>
<text x="122.5" y="156.0" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">= raw score / 100</text>
<path d="M215 110.0L245 110.0" stroke="#111216" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="245" y="40" width="215" height="140" rx="8" fill="#FFFFFF" stroke="#8A2C0D" stroke-width="1.5"/>
<text x="352.5" y="79.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111216">Penalties</text>
<text x="352.5" y="96.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">X1 fabricated reference</text>
<text x="352.5" y="113.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">−3 each, cap −9</text>
<text x="352.5" y="130.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">X2 AI slop −3 or −5</text>
<text x="352.5" y="147.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">both human-confirmed</text>
<path d="M460 110.0L490 110.0" stroke="#111216" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="490" y="40" width="245" height="140" rx="8" fill="#ECEFFD" stroke="#4F5FD0" stroke-width="1.5"/>
<text x="612.5" y="79.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111216">Normalization</text>
<text x="612.5" y="96.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">drop the 2 highest and 2 lowest</text>
<text x="612.5" y="113.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">raw scores; scale so the highest</text>
<text x="612.5" y="130.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">remaining = 100;</text>
<text x="612.5" y="147.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">expected factor about ×2</text>
<path d="M735 110.0L765 110.0" stroke="#111216" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="765" y="40" width="120" height="140" rx="8" fill="#FFFFFF" stroke="#3A48A8" stroke-width="1.5"/>
<text x="825.0" y="89.0" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111216">Final grade</text>
<text x="825.0" y="106.0" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111216">1–100</text>
<text x="825.0" y="123.0" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111216">(capped at</text>
<text x="825.0" y="140.0" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111216">100)</text>
<text x="30" y="214" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#555866">Pilot raw scores with no student-only work: 44 (run A alone) and 57 (run B). The written report (R, 25 points), your own steering</text>
<text x="30" y="230" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#555866">(C3) and the replay package are the points only you can add.</text>
<text x="30" y="252" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#555866">Expect raw scores in the 40s–60s under the token limits; the normalization is published in advance, so a raw 45 is not a failing</text>
<text x="30" y="268" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#555866">grade. No presentation, no video.</text>
<text x="30" y="290" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#555866">Order of operations: item scores → eligibility cap → penalties → lateness → class normalization → rounded once.</text>
</svg>
