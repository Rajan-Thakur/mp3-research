CE5" stroke-width="1.5"/><text x="619.0" y="172.33333333333334" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111216">4 Paper writing</text><text x="619.0" y="190.33333333333334" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111216">Haiku executor</text><path d="M694 177L712 177" stroke="#111216" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M619 84L619 150" stroke="#111216" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="602" y="118" width="34" height="18" rx="4" fill="#FFFFFF" stroke="#4F5FD0"/><text x="619" y="131" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#4F5FD0">[[GATE]]</text><rect x="712" y="150" width="150" height="54" rx="8" fill="#FFFFFF" stroke="#DADCE5" stroke-width="1.5"/><text x="787.0" y="172.33333333333334" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111216">5 Claim audit</text><text x="787.0" y="190.33333333333334" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111216">Haiku executor</text><path d="M787 84L787 150" stroke="#111216" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="787.0" y="111.0" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#555866">gate</text><rect x="770" y="118" width="34" height="18" rx="4" fill="#FFFFFF" stroke="#4F5FD0"/><text x="787" y="131" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#4F5FD0">[[GATE]]</text><rect x="250" y="250" width="400" height="54" rx="8" fill="#FFFFFF" stroke="#DADCE5" stroke-width="1.5"/><text x="450.0" y="272.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111216">Sonnet reviewer, called by the executor at your request</text><text x="450.0" y="289.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111216">reads your files with Read/Grep/Glob; 6–8 calls per run; most of the cost</text><path d="M450 204L450 250" stroke="#111216" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="30" y="318" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#555866">Every arrow down is a stop. The executor ends its message with [[GATE: name]] and waits; your reply is a Decision block in notes/steering-log.md.</text></svg>