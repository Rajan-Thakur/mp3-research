<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t"><title id="t">Two required runs on the same paper: A unguided, then B guided, then compare them in the report</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111216"/></marker></defs><rect width="900" height="360" fill="#FFFFFF"/><rect x="30" y="30" width="840" height="46" rx="8" fill="#ECEFFD" stroke="#4F5FD0" stroke-width="1.5"/><text x="450.0" y="57.666666666666664" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111216">Same paper, same models (Haiku executor, Sonnet reviewer), same $20-capped key</text><rect x="40" y="110" width="380" height="120" rx="8" fill="#FFFFFF" stroke="#DADCE5" stroke-width="1.5"/><text x="230.0" y="147.33333333333334" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111216">Run A: unguided</text><text x="230.0" y="165.33333333333334" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111216">AUTO_PROCEED: true, no gates</text><text x="230.0" y="183.33333333333334" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111216">about 1 h, about $3 (pilot: 56 min, $2.40–3.20)</text><text x="230.0" y="201.33333333333334" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111216">output moved to runs/A/, tag mp3-run-a</text><rect x="480" y="110" width="380" height="120" rx="8" fill="#FFFFFF" stroke="#DADCE5" stroke-width="1.5"/><text x="670.0" y="147.33333333333334" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111216">Run B: guided (the real one)</text><text x="670.0" y="165.33333333333334" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111216">AUTO_PROCEED: false, you answer every gate</text><text x="670.0" y="183.33333333333334" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111216">about 1.5 h agent + 2–4 h of you (pilot: 72 min, $4–7.50)</text><text x="670.0" y="201.33333333333334" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111216">stays in the project root, tag mp3-ai-draft</text><path d="M420 170L480 170" stroke="#111216" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="450.0" y="164.0" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#555866">then</text><rect x="190" y="270" width="520" height="60" rx="8" fill="#FFFFFF" stroke="#3A48A8" stroke-width="1.5"/><text x="450.0" y="295.3333333333333" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111216">Final report (REPORT.md)</text><text x="450.0" y="313.3333333333333" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111216">judge scores for A and B side by side, why they differ, what your review found</text><path d="M230 230L330 270" stroke="#111216" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M670 230L570 270" stroke="#111216" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="30" y="350" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#555866">Pilot totals: A + B = $6.40–10.70, inside the $20 cap. What breaks the budget is a long or multi-part paper, not the second run.</text></svg>