<text x="468" y="197" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3A48A8">Sat–Sun</text>
<text x="555" y="189" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">Judge A and B; write REPORT.md; replay package;</text>
<text x="555" y="203" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">README</text>
