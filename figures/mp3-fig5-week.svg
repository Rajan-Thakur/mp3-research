<text x="468" y="243" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3A48A8">Mon–Tue</text>
<text x="555" y="235" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">CP8 preflight, tag mp3-final, Moodle before Tue</text>
<text x="555" y="249" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">2:40 pm</text>
<text x="30" y="282" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#555866">Usage limits: Pro resets every 5 hours; the API key is capped at $20. Spread the agent runs over several windows and days; never</text>
<text x="30" y="298" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#555866">leave a run for the last window.</text>
<text x="30" y="320" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#555866">If you have no working small baseline by the end of week 1, write to the instructor and shrink the task. Run A alone, documented,</text>
<text x="30" y="336" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#555866">is an acceptable submission.</text>
<rect x="690" y="350" width="180" height="26" rx="6" fill="#8A2C0D"/>
<text x="780.0" y="367" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">DUE Tue Nov 17, 2:40 pm</text>
