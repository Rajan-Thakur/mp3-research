fill="#111216">Wed</text><text x="330.0" y="103.66666666666667" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">Run A (unguided)</text><text x="330.0" y="119.66666666666667" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">Run B gate 1–2</text><rect x="396" y="40" width="112" height="120" rx="8" fill="#FFFFFF" stroke="#DADCE5" stroke-width="1.5"/><text x="452.0" y="87.66666666666667" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#111216">Thu</text><text x="452.0" y="103.66666666666667" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">CP5 baseline, ceiling check</text><text x="452.0" y="119.66666666666667" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">Run B main experiment</text><rect x="518" y="40" width="112" height="120" rx="8" fill="#FFFFFF" stroke="#DADCE5" stroke-width="1.5"/><text x="574.0" y="87.66666666666667" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#111216">Fri</text><text x="574.0" y="103.66666666666667" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">Run B review + draft</text><text x="574.0" y="119.66666666666667" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">tag mp3-ai-draft</text><rect x="640" y="40" width="112" height="120" rx="8" fill="#FFFFFF" stroke="#DADCE5" stroke-width="1.5"/><text x="696.0" y="87.66666666666667" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#111216">Sat</text><text x="696.0" y="103.66666666666667" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">CP7 your audit</text><text x="696.0" y="119.66666666666667" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">judge A and B; REPORT.md</text><rect x="762" y="40" width="112" height="120" rx="8" fill="#FFFFFF" stroke="#DADCE5" stroke-width="1.5"/><text x="818.0" y="87.66666666666667" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#111216">Sun</text><text x="818.0" y="103.66666666666667" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">video ≤ 8 min</text><text x="818.0" y="119.66666666666667" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">CP8 tag mp3-final, Moodle</text><text x="30" y="195" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#555866">Monday's paper choice is the decision that sets everything after it. If you have no working small baseline by Thursday, write to the instructor and shrink the task.</text><text x="30" y="220" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#555866">Agent time in the pilots: 56 min (A) and 72 min (B). Your own time: 15–21 hours across the week.</text></svg>