<text x="125" y="143" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">CP2 gap; CP3 install ARIS, smoke test; Thu</text>
<text x="125" y="157" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">class: checkpoint</text>
