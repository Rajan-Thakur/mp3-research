<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" width="900" height="396" role="img" aria-labelledby="t"><title id="t">Two weeks: plan backwards from Tuesday November 17, 2:40 pm, across several 5-hour usage windows</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111216"/></marker></defs><rect width="900" height="396" fill="#FFFFFF"/>
