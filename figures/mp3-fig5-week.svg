<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t"><title id="t">Two weeks: plan backwards from Tuesday November 17, 2:40 pm, across several 5-hour usage windows</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111216"/></marker></defs><rect width="900" height="330" fill="#FFFFFF"/><rect x="30" y="40" width="410" height="28" rx="8" fill="#ECEFFD" stroke="#4F5FD0" stroke-width="1.5"/><text x="235.0" y="58.333333333333336" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111216">Week 1: Nov 2–8</text><rect x="30" y="80" width="410" height="40" rx="6" fill="#FFFFFF" stroke="#DADCE5"/><text x="38" y="105" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3A48A8">Mon–Tue</text><text x="125" y="105" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">CP0 accounts, $20 cap; CP1 pick the paper (search + second check)</text><rect x="30" y="126" width="410" height="40" rx="6" fill="#FFFFFF" stroke="#DADCE5"/><text x="38" y="151" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3A48A8">Wed–Thu</text><text x="125" y="151" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">CP2 gap; CP3 install ARIS, smoke test; Thu class: checkpoint</text><rect x="30" y="172" width="410" height="40" rx="6" fill="#FFFFFF" stroke="#DADCE5"/><text x="38" y="197" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3A48A8">Fri</text><text x="125" y="197" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">Run A unguided (~1 h agent time)</text><rect x="30" y="218" width="410" height="40" rx="6" fill="#FFFFFF" stroke="#DADCE5"/><text x="38" y="243" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3A48A8">Sat–Sun</text><text x="125" y="243" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">Run B gates 1–4: idea, plan, baseline, ceiling check</text><rect x="460" y="40" width="410" height="28" rx="8" fill="#ECEFFD" stroke="#4F5FD0" stroke-width="1.5"/><text x="665.0" y="58.333333333333336" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111216">Week 2: Nov 9–17</text><rect x="460" y="80" width="410" height="40" rx="6" fill="#FFFFFF" stroke="#DADCE5"/><text x="468" y="105" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3A48A8">Mon–Wed</text><text x="555" y="105" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">Run B main experiment, review loop; office hours</text><rect x="460" y="126" width="410" height="40" rx="6" fill="#FFFFFF" stroke="#DADCE5"/><text x="468" y="151" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3A48A8">Thu–Fri</text><text x="555" y="151" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">Draft, tag mp3-ai-draft; your audit (numbers, references, prose)</text><rect x="460" y="172" width="410" height="40" rx="6" fill="#FFFFFF" stroke="#DADCE5"/><text x="468" y="197" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3A48A8">Sat–Sun</text><text x="555" y="197" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">Judge A and B; write REPORT.md; replay package; README</text><rect x="460" y="218" width="410" height="40" rx="6" fill="#FFFFFF" stroke="#DADCE5"/><text x="468" y="243" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3A48A8">Mon–Tue</text><text x="555" y="243" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">CP8 preflight, tag mp3-final, Moodle before Tue 2:40 pm</text><rect x="770" y="266" width="100" height="26" rx="6" fill="#8A2C0D"/><text x="820" y="283" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">DUE Tue 2:40 pm</text><text x="30" y="283" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#555866">Usage limits: Pro resets every 5 hours; the API key is capped at $20. Spread the agent runs over several windows and days; never leave a run for the last window.</text><text x="30" y="305" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#555866">If you have no working small baseline by the end of week 1, write to the instructor and shrink the task. Run A alone, documented, is an acceptable submission.</text></svg>