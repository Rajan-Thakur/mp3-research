<text x="38" y="197" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3A48A8">Fri</text>
<text x="125" y="197" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">Run A unguided (about 1 h agent time)</text>
<rect x="30" y="218" width="410" height="40" rx="6" fill="#FFFFFF" stroke="#DADCE5"/>
<text x="38" y="243" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3A48A8">Sat–Sun</text>
<text x="125" y="235" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">Run B gates 1–4: idea, plan, baseline, ceiling</text>
<text x="125" y="249" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">check</text>
<rect x="460" y="40" width="410" height="28" rx="8" fill="#ECEFFD" stroke="#4F5FD0" stroke-width="1.5"/>
<text x="665" y="58.5" text-anchor="middle" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111216">Week 2: Nov 9–17</text>
<rect x="460" y="80" width="410" height="40" rx="6" fill="#FFFFFF" stroke="#DADCE5"/>
<text x="468" y="105" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3A48A8">Mon–Wed</text>
<text x="555" y="105" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">Run B main experiment, review loop; office hours</text>
<rect x="460" y="126" width="410" height="40" rx="6" fill="#FFFFFF" stroke="#DADCE5"/>
<text x="468" y="151" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3A48A8">Thu–Fri</text>
<text x="555" y="143" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">Draft, tag mp3-ai-draft; your audit (numbers,</text>
<text x="555" y="157" text-anchor="start" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#111216">references, prose)</text>
